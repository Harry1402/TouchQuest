name: CI / Quality & Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
