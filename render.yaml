services:
  - type: web
    name: touchquest
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_API_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: GEMMA_MODEL
        value: gemini-3.8-flash
      - key: GEMMA_VISION_MODEL
        value: gemini-3.8-flash
